name: Godot Build
on: [ workflow_call, workflow_dispatch ]

jobs:
  build:
    name: Compile Godot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Godot by Action Commons
        id: godot
        uses: ActionCommons/build-godot@v1.1.0
        with:
         version: 4.7.1
         platform: android
         target: template_release
         architecture: arm64
         options: |
           debug_symbols=no


      - name: Copy final binary to root
        run: |
          FINAL_FILE=$(find ${{ steps.godot.outputs.directory }}/bin -maxdepth 1 -type f \( -name "*.apk" -o -name "*.a" -o -name "*.so" -o -name "*.zip" -o -name "godot*" \) | head -n 1)
          
          cp "$FINAL_FILE" ./final_template_output
          
          echo "Copied: $FINAL_FILE"


      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-compiled-template
          path: ./final_template_output
