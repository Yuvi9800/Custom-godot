name: Build Stripped Encrypted Godot Android Shared Library (.so)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-android-so:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Godot Engine Source Code
        uses: actions/checkout@v4
        with:
          repository: 'godotengine/godot'
          ref: '4.7.1-stable' # Change to match your Godot version tag

      - name: Set up Python & SCons
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: python -m pip install scons

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          link-to-sdk: true

      - name: Compile libgodot_android.so (arm64-v8a)
        env:
          SCRIPT_AES256_ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          # Build target: Release Template, Architecture: ARM64
          scons platform=android target=template_release arch=arm64 production=yes \
                module_upnp_enabled=no \
                module_godot_physics_3d_enabled=false \
                module_openxr_enabled=false \
                pulseaudio=false \
                wayland=false \
                x11=false \
                forward_plus_renderer=false \
                disable_xr=true \
                disable_navigation_2d=true \
                disable_navigation_3d=true \
                module_text_server_advanced_enabled=no \
                module_text_server_fb_enabled=yes \
                module_gridmap_enabled=no \
                module_mobile_vr_enabled=no \
                module_webxr_enabled=no \
                module_webrtc_enabled=no \
                module_websocket_enabled=no \
                module_jsonrpc_enabled=no \
                module_bmp_enabled=no \
                module_dds_enabled=no \
                module_tga_enabled=no \
                module_svg_enabled=no \
                debug_symbols=no \
                lto=full \
                deprecated=no \
                use_static_cpp=yes \
                optimize=size

      - name: Locate and Collect Compiled .so Libraries
        run: |
          mkdir -p output_so/
          # Final libgodot_android.so or platform-specific variant inside platform/android/ or bin/
          find . -name "*.so" -exec cp {} output_so/ \;

      - name: Upload .so Shared Libraries
        uses: actions/upload-artifact@v4
        with:
          name: godot-android-arm64-lib-encrypted
          path: output_so/
